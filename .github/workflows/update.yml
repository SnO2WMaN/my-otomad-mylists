name: Update mylist URL

on:
  push:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      skip_post:
        description: "Publish the lists without posting to Fedibird"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run update
        env:
          FEDIBIRD_ACCESS_TOKEN: ${{ secrets.FEDIBIRD_ACCESS_TOKEN }}
          SKIP_POST: ${{ inputs.skip_post && '1' || '0' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
